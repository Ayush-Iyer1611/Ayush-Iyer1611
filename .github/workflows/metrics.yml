name: Refresh profile metrics

on:
  # Refresh once daily at 06:00 IST.
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub metrics dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Ayush-Iyer1611
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_display: columns
          config_padding: 12

          # Visual analytics inspired by the reference dashboard.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage, bytes-size

          plugin_habits: yes
          plugin_habits_days: 30
          plugin_habits_charts: yes
          plugin_habits_facts: yes

          plugin_topics: yes
          plugin_topics_limit: 12

          # Keep the dashboard renderable if an optional plugin has no data.
          plugins_errors_fatal: no

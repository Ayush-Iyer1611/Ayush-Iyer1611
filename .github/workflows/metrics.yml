name: Refresh profile metrics

on:
  # Daily refresh at 06:00 IST.
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# A new manual run replaces any previous run still in progress.
concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate GitHub metrics dashboard
        uses: lowlighter/metrics@latest
        with:
          # Classic PAT is required by the current v3 Metrics action.
          token: ${{ secrets.METRICS_TOKEN }}
          # Use the built-in workflow token only to commit the generated SVG.
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: Ayush-Iyer1611
          filename: github-metrics.svg
          template: classic

          # Start with core profile data and two key visual plugins.
          base: header, activity, community, repositories, metadata
          repositories: 25

          config_timezone: Asia/Kolkata
          config_display: columns
          config_padding: 12
          config_order: base.header, isocalendar, languages, base.activity, base.community, base.repositories, base.metadata

          # Half-year contribution calendar.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Most-used languages with percentage and size information.
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage, bytes-size

          # Surface plugin errors in the job rather than silently hiding them.
          plugins_errors_fatal: yes

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Ayush Iyer — Computer Science, Security and Quantum Computing</title>
  <desc id="desc">A dark technical banner with a subtle grid, abstract orbital paths and the name Ayush Iyer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset="0.58" stop-color="#101b2b"/>
      <stop offset="1" stop-color="#102d35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59d6c8"/>
      <stop offset="1" stop-color="#7aa7ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#91a8c2" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#49d8c8" stop-opacity=".20"/>
      <stop offset="1" stop-color="#49d8c8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <circle cx="1000" cy="165" r="250" fill="url(#glow)"/>
  <path d="M720 260C830 65 1020 30 1160 110" fill="none" stroke="#62d7ca" stroke-opacity=".35" stroke-width="1.5"/>
  <path d="M750 300C890 120 1040 100 1190 185" fill="none" stroke="#83aaff" stroke-opacity=".30" stroke-width="1.5"/>
  <ellipse cx="1000" cy="168" rx="158" ry="70" transform="rotate(-28 1000 168)" fill="none" stroke="#70d9d0" stroke-opacity=".45" stroke-width="1.4"/>
  <ellipse cx="1000" cy="168" rx="158" ry="70" transform="rotate(40 1000 168)" fill="none" stroke="#83aaff" stroke-opacity=".35" stroke-width="1.4"/>
  <circle cx="1000" cy="168" r="24" fill="#173c48" stroke="#6de0d3" stroke-width="1.6"/>
  <circle cx="1000" cy="168" r="7" fill="#9ff4e7"/>
  <circle cx="876" cy="102" r="5" fill="#79a8ff"/>
  <circle cx="1122" cy="232" r="5" fill="#62d7ca"/>

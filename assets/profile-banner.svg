  <text x="78" y="105" fill="#82ded5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="3">COMPUTER SCIENCE &amp; ENGINEERING</text>
  <text x="74" y="190" fill="#f2f6fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">AYUSH IYER</text>
  <text x="80" y="232" fill="#b7c7da" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" letter-spacing=".4">Software Engineering  /  Cybersecurity  /  Quantum Computing</text>
  <text x="80" y="285" fill="#7f96ae" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">BUILD SYSTEMS  ·  STUDY SECURITY  ·  EXPLORE THE UNKNOWN</text>
